<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tasks - Minhas Tarefas</title>
  <link rel="icon" type="image/png" href="./img/favicon.ico">
  <link rel="stylesheet" href="./css/app.css">
  <script type="module" src="./js/app.ts"></script>
  <script type="module" src="./js/pages/tasks.ts"></script>
<script type="module" src="./js/teste.ts"></script>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

  <header class="bg-primary text-white d-flex justify-content-between align-items-center py-4 px-4 shadow-sm">
    <h1 class="h3 m-0">Minhas Tarefas</h1>
    <button id="logout-btn" class="btn btn-light btn-sm">Sair</button>
  </header>

  <main class="container flex-grow-1 py-5 d-flex flex-column flex-lg-row gap-4">

    <section id="tasks-container" class="card shadow-sm p-4 flex-grow-1"></section>

    <section id="add-task-section" class="card shadow-sm p-4 d-flex flex-column gap-2 text-center">
      <h5>Nova Tarefa</h5>
      <input type="text" id="task-input" class="form-control" placeholder="Digite a tarefa..." />
      <button id="add-task-btn" class="btn btn-primary" type="button">Adicionar</button>

      <hr class="my-2" />

      <button id="assign-task-open-btn" class="btn btn-outline-primary" type="button" data-bs-toggle="modal"
        data-bs-target="#assign-task-modal">
        Nova tarefa para outro usuário
      </button>
      <div id="assign-task-feedback" class="small" role="status"></div>
    </section>

  </main>

  <!-- Modal: criar tarefa e atribuir a outro usuário (busca via POST /users/search) -->
  <div class="modal fade" id="assign-task-modal" tabindex="-1" aria-labelledby="assign-task-modal-title"
    aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="assign-task-modal-title">Nova tarefa para outro usuário</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>

        <div class="modal-body d-flex flex-column gap-3">

          <div>
            <label for="assign-task-name" class="form-label">Nome da tarefa</label>
            <input type="text" id="assign-task-name" class="form-control" placeholder="Digite a tarefa..." />
          </div>

          <form id="assign-search-form" class="d-flex flex-column gap-2">
            <label for="assign-search-value" class="form-label m-0">Buscar usuário</label>
            <div class="input-group">
              <select id="assign-search-field" class="form-select flex-grow-0 w-auto" aria-label="Campo de busca">
                <option value="name" selected>Nome</option>
                <option value="email">E-mail</option>
                <option value="job_title">Cargo</option>
                <option value="city">Cidade</option>
                <option value="state">UF</option>
                <option value="bio">Bio</option>
              </select>
              <input type="text" id="assign-search-value" class="form-control" placeholder="Ex.: curitiba" />
              <button id="assign-search-btn" class="btn btn-primary" type="submit">Buscar</button>
            </div>
          </form>

          <div id="assign-search-results"></div>

          <div id="assign-selected-user" class="alert alert-secondary m-0 py-2">Nenhum usuário escolhido.</div>

          <div id="assign-task-error" class="alert alert-danger m-0 py-2 d-none" role="alert"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="assign-task-submit" class="btn btn-primary" disabled>Criar tarefa</button>
        </div>

      </div>
    </div>
  </div>

  <footer class="bg-primary text-white text-center py-3 mt-auto">
    <div class="small">Frontend 2026.2</div>
  </footer>
</body>

</html>
